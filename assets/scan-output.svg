  <text class="text" x="30" y="472" xml:space="preserve">  ● </text><text class="green" x="55" y="472">[200]</text><text class="white" x="110" y="472">https://api.hackthebox.com</text><text class="dim" x="370" y="472">(104.18.15.68)</text><text class="blue" x="510" y="472">[Nginx]</text><text class="orange" x="580" y="472">☁ Cloudflare</text>
  <text class="text" x="30" y="492" xml:space="preserve">  ● </text><text class="yellow" x="55" y="492">[301]</text><text class="white" x="110" y="492">https://forum.hackthebox.com</text><text class="dim" x="370" y="492">(172.67.33.1)</text><text class="blue" x="510" y="492">[Discourse]</text><text class="orange" x="600" y="492">☁ Cloudflare</text>
  <text class="text" x="30" y="512" xml:space="preserve">  ● </text><text class="red" x="55" y="512">[403]</text><text class="white" x="110" y="512">https://staging.hackthebox.com</text><text class="dim" x="370" y="512">(52.18.99.12)</text><text class="blue" x="510" y="512">[Nginx]</text><text class="green" x="580" y="512">☁ AWS</text>
  <text class="dim" x="30" y="532" xml:space="preserve">  ... (183 more hosts probed)</text>
  
  <text class="white bold" x="30" y="556" xml:space="preserve">  Alive: </text><text class="green bold" x="105" y="556">188 / 265</text>
  <text class="white bold" x="30" y="576" xml:space="preserve">  ☁ Cloud: </text><text class="orange" x="120" y="576">Cloudflare: 142</text><text class="dim" x="280" y="576">,</text><text class="green" x="295" y="576">AWS: 31</text><text class="dim" x="375" y="576">,</text><text class="blue" x="390" y="576">Azure: 8</text><text class="dim" x="475" y="576">,</text><text class="magenta" x="490" y="576">Heroku: 7</text>

  <!-- Phase 6 Takeover -->
  <text class="yellow bold" x="30" y="606" xml:space="preserve">[*] Phase 6: Subdomain Takeover Check</text>
  <text class="red bold" x="30" y="628" xml:space="preserve">  ⚠ VULNERABLE: old-blog.hackthebox.com</text>
  <text class="red" x="30" y="646" xml:space="preserve">    CNAME → hackthebox.herokuapp.com → "No such app"</text>

  <text class="text" x="30" y="432" xml:space="preserve">  ● </text><text class="green" x="55" y="432">[200]</text><text class="white" x="110" y="432">https://www.hackthebox.com</text><text class="dim" x="370" y="432">(104.18.12.34)</text><text class="blue" x="510" y="432">[React]</text><text class="orange" x="580" y="432">☁ Cloudflare</text>

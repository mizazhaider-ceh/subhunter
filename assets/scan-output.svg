  <circle class="dot-yellow" cx="40" cy="19" r="6"/>
  <circle class="dot-green" cx="60" cy="19" r="6"/>
  <text class="title-text" x="380" y="23" text-anchor="middle">subhunter.py -d hackthebox.com --recursive --takeover --ports</text>


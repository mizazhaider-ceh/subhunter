<svg xmlns="http://www.w3.org/2000/svg" width="850" height="600" viewBox="0 0 850 600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      .report-bg { fill: #0a0a1a; }
      .card-bg { fill: #111827; }
      .card-border { stroke: #1e293b; stroke-width: 1; fill: none; }
      .header-bg { fill: linear-gradient(135deg, #00ff88, #00ccff); }
      .text-white { fill: #f0f6fc; font-family: 'Inter', -apple-system, sans-serif; }
      .text-gray { fill: #6b7280; font-family: 'Inter', -apple-system, sans-serif; }
      .text-green { fill: #00ff88; font-family: 'Inter', -apple-system, sans-serif; }
      .text-cyan { fill: #00ccff; font-family: 'Inter', -apple-system, sans-serif; }
      .text-red { fill: #ff4757; font-family: 'Inter', -apple-system, sans-serif; }
      .text-yellow { fill: #ffd93d; font-family: 'Inter', -apple-system, sans-serif; }
      .text-orange { fill: #ffa657; font-family: 'Inter', -apple-system, sans-serif; }
      .text-blue { fill: #58a6ff; font-family: 'Inter', -apple-system, sans-serif; }
      .bar-green { fill: #00ff88; opacity: 0.85; }
      .bar-red { fill: #ff4757; opacity: 0.85; }
      .bar-yellow { fill: #ffd93d; opacity: 0.85; }
      .bar-blue { fill: #58a6ff; opacity: 0.85; }
      .bar-bg { fill: #1e293b; }
      .table-header { fill: #1a1a2e; }
      .table-row-even { fill: #111827; }
      .table-row-odd { fill: #0f172a; }
      .table-border { stroke: #1e293b; stroke-width: 0.5; }
      .badge { rx: 4; ry: 4; }
      .gradient-line { fill: url(#grad1); }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />

  <text class="text-gray" x="290" y="495" font-size="10">104.18.15.67</text>
  <rect fill="#00ff88" x="420" y="485" width="32" height="14" rx="3"/><text fill="#0a0a1a" x="427" y="495" font-size="9" font-weight="600">200</text>
  <text class="text-blue" x="500" y="495" font-size="10">Node.js</text>
  <text class="text-orange" x="600" y="495" font-size="10">Cloudflare</text>
  <text class="text-gray" x="700" y="495" font-size="10">80, 443</text>

  <rect class="table-row-odd" x="45" y="502" width="760" height="22"/>
  <text class="text-cyan" x="60" y="517" font-size="10">api.hackthebox.com</text>
  <text class="text-gray" x="290" y="517" font-size="10">104.18.15.68</text>
  <rect fill="#00ff88" x="420" y="507" width="32" height="14" rx="3"/><text fill="#0a0a1a" x="427" y="517" font-size="9" font-weight="600">200</text>
  <text class="text-blue" x="500" y="517" font-size="10">Nginx</text>
  <text class="text-orange" x="600" y="517" font-size="10">Cloudflare</text>
  <text class="text-gray" x="700" y="517" font-size="10">80, 443, 8080</text>

  <rect class="table-row-even" x="45" y="524" width="760" height="22"/>
  <text class="text-cyan" x="60" y="539" font-size="10">staging.hackthebox.com</text>
  <text class="text-gray" x="290" y="539" font-size="10">52.18.99.12</text>
  <rect fill="#ff4757" x="420" y="529" width="32" height="14" rx="3"/><text fill="#f0f6fc" x="427" y="539" font-size="9" font-weight="600">403</text>
  <text class="text-blue" x="500" y="539" font-size="10">Nginx</text>
  <text class="text-green" x="600" y="539" font-size="10">AWS</text>
  <text class="text-gray" x="700" y="539" font-size="10">80, 443, 22</text>

